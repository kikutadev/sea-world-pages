<body>
  <div id="viewport">
    <div class="hud topline">
      <div class="brand"><b>SEA / WORLD</b><span class="small">UNDERWATER FIELD CAMERA</span></div>
      <div class="rec"><i></i>LIVE <span id="timecode">00:00:00</span></div>
    </div>
    <div class="left-ticks"><span></span></div>
    <div class="focus"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><i class="center"></i></div>
    <button type="button" class="shutter" id="shutter" aria-label="撮影">◎ PHOTO</button>
    <button type="button" class="help-toggle" id="help-toggle" aria-expanded="false" aria-controls="help-panel" aria-label="操作方法を表示">?</button>
    <div class="help-panel" id="help-panel" hidden>PC：WASD / 矢印で移動、ドラッグで見回す<br>Space / E で浮上、C / Q で潜水、Shift で加速<br>スマホ：左スティックで移動、ドラッグで見回す<br>UP / DN を長押しして上下移動</div>
    <div class="hud bottom">
      <div class="stat">
        <label>DEPTH / 深度</label>
        <b id="depth">--.-</b><span class="unit">m</span>
        <div class="sub">HDG <span id="heading">---°</span> &nbsp;·&nbsp; <span id="speed">0.0</span> m/s</div>
      </div>
      <div class="right-bottom">
        <div class="stat"><label>NEAREST SUBJECT</label><div id="nearest">魚を探索中</div></div>
        <div id="fishCount">SUBJECTS // --</div>
      </div>
    </div>
    <div class="touch-controls" id="touch-controls">
      <div id="stick"><div id="stick-knob"></div></div>
      <div class="vertical-buttons"><button id="ascend" aria-label="浮上">▲ UP</button><button id="descend" aria-label="潜水">▼ DN</button></div>
    </div>
    <div id="message" role="status"></div>
  </div>
  <div id="loading"><div><b>SEA WORLD</b><span class="line"></span><p id="loadingText">海中の光を準備しています</p></div></div>
  <div id="perf">
    <div id="pGpu"></div><div id="pSpec"></div>
    <b id="pFps">–</b> FPS <i id="pMode">VSYNC</i> <span id="pMs"></span>
    <canvas id="pGraph" width="456" height="48"></canvas>
    <button id="pUncap">Uncap FPS</button><button id="pBench">Run benchmark</button><pre id="hud"></pre>
  </div>
