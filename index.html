<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#061b22" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23012432%27/%3E%3Ctext x=%275%27 y=%2724%27 font-size=%2723%27 fill=%27%23a4e8e9%27%3E%CE%A6%3C/text%3E%3C/svg%3E">
  <meta name="description" content="魚と出会いながら水中を泳ぐ。一人称の海洋探索プレビュー。" />
  <title>SEA WORLD — 水中フィールドカメラ</title>
  <script type="module" crossorigin src="/sea-world-pages/assets/index-Dk5e0LFZ.js"></script>
  <link rel="stylesheet" crossorigin href="/sea-world-pages/assets/index-CIR6gTTK.css">
</head>
<body>
  <div id="viewport">
    <div class="focus" aria-hidden="true">
      <i class="corner tl"></i><i class="corner tr"></i>
      <i class="corner bl"></i><i class="corner br"></i>
      <i class="center"></i>
    </div>

    <button type="button" class="help-toggle" id="help-toggle" aria-expanded="false" aria-controls="help-panel" aria-label="操作方法を表示">?</button>
    <button type="button" class="gallery-toggle" id="gallery-toggle" aria-label="写真ギャラリーを開く" title="写真ギャラリー">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m5.8 17 4.8-5 3 3 2.6-2.6 3 3.4"/><circle cx="16.3" cy="8.5" r="1.4"/></svg>
      <span id="gallery-marker" class="gallery-marker" hidden></span>
    </button>
    <div class="help-panel" id="help-panel" hidden>PC：WASD / 矢印で移動、ドラッグで見回す<br>Space / E で浮上、C / Q で潜水、Shift で加速<br>スマホ：左スティックで移動、画面をドラッグして見回す<br>右側の小さな矢印を長押しして浮上・潜水</div>

    <div class="touch-controls" id="touch-controls">
      <div id="stick" aria-label="移動スティック"><div id="stick-knob"></div></div>
    </div>
    <div class="capture-controls">
      <div class="vertical-buttons">
        <button type="button" id="ascend" aria-label="浮上">↑</button>
        <button type="button" id="descend" aria-label="潜水">↓</button>
      </div>
      <button type="button" class="shutter" id="shutter" aria-label="写真を撮る" title="写真を撮る">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 7.5h3.2l1.4-2h6.8l1.4 2H20a1.5 1.5 0 0 1 1.5 1.5v10A1.5 1.5 0 0 1 20 20.5H4A1.5 1.5 0 0 1 2.5 19V9A1.5 1.5 0 0 1 4 7.5Z" />
          <circle cx="12" cy="13.7" r="3.6"/>
          <path d="M18.1 10.3h.1"/>
        </svg>
      </button>
    </div>
    <div id="message" role="status"></div>
  </div>
  <section id="photo-layer" class="photo-layer" role="dialog" aria-modal="true" aria-labelledby="photo-title" hidden>
    <div class="album-shell">
      <header class="album-bar">
        <div class="album-label"><h2 id="photo-title">写真ギャラリー</h2></div>
        <button type="button" class="album-close" id="album-close" aria-label="写真画面を閉じる">×</button>
      </header>
      <section id="gallery-view" class="album-gallery" hidden>
        <div class="album-gallery-meta"><span id="gallery-count">0枚</span><button type="button" id="gallery-back" class="album-text-button">海に戻る</button></div>
        <p id="gallery-empty" class="gallery-empty">まだ写真がありません。<br>海で撮影すると、ここに並びます。</p>
        <div id="gallery-grid" class="gallery-grid"></div>
        <p class="album-footnote">写真はこのブラウザ内に保存されます。ほかの端末には同期されません。</p>
      </section>
      <section id="photo-detail" class="album-detail" hidden>
        <div class="photo-stage"><img id="photo-image" alt="撮影した水中の写真" /></div>
        <div class="photo-caption"><time id="photo-date"></time><span id="photo-status" role="status"></span></div>
        <div class="photo-actions">
          <button type="button" class="album-quiet-button" id="photo-back">撮影に戻る</button>
          <button type="button" class="album-quiet-button" id="photo-show-gallery">ギャラリー</button>
          <button type="button" class="album-quiet-button photo-delete" id="photo-delete" hidden>削除</button>
          <button type="button" class="album-primary-button" id="photo-save">端末に保存</button>
        </div>
      </section>
    </div>
  </section>
  <div id="loading"><div><b>SEA WORLD</b><span class="line"></span><p id="loadingText">海中の光を準備しています</p></div></div>
  <div id="perf">
    <div id="pGpu"></div><div id="pSpec"></div>
    <b id="pFps">–</b> FPS <i id="pMode">VSYNC</i> <span id="pMs"></span>
    <canvas id="pGraph" width="456" height="48"></canvas>
    <button id="pUncap">Uncap FPS</button><button id="pBench">Run benchmark</button><pre id="hud"></pre>
  </div>
</body>
</html>
